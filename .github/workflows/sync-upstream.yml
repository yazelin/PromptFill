name: 同步上游資料檔

# 已停用自動排程（CLAUDE.md：不自動同步上游的上游），只保留手動觸發。
# 注意：上游 templates.js 是雙語結構，0.8.0 起本 repo 已繁中特化（攤平為純字串），
# 手動執行前先確認 sync-upstream.mjs 會處理攤平，否則會把資料檔打回雙語、弄壞站台。
on:
  workflow_dispatch:

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 檢查是否有未合併的同步 PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --state open --search "同步上游資料檔" --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "已存在未合併的同步 PR #$EXISTING_PR，跳過本次同步"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 設定 Node.js
        if: steps.check-pr.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝依賴
        if: steps.check-pr.outputs.skip != 'true'
        run: npm install

      - name: 執行同步腳本
        if: steps.check-pr.outputs.skip != 'true'
        run: node .github/workflows/sync-upstream.mjs

      - name: 檢查變更並創建 PR
        if: steps.check-pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/banks.js src/data/templates.js

          # 檢查是否有變更
          if git diff --staged --quiet; then
            echo "沒有變更需要提交"
            exit 0
          fi

          # 創建新分支
          BRANCH_NAME="sync-upstream-$(date +%Y%m%d)"
          git checkout -b "$BRANCH_NAME"

          git commit -m "chore: 同步 doggy8088/PromptFill 上游資料檔"
          git push origin "$BRANCH_NAME"

          # 創建 PR（heredoc 內容必須縮排，貼齊 run 區塊，否則 YAML 解析失敗）
          gh pr create \
            --title "chore: 同步上游資料檔 $(date +%Y-%m-%d)" \
            --body "$(cat <<'EOF'
          ## 自動同步上游資料檔

          此 PR 由 GitHub Actions 自動建立，同步來自 doggy8088/PromptFill 的資料檔：

          - src/data/templates.js
          - src/data/banks.js

          同步過程已自動執行詞彙修正（如：模板 → 範本）。

          請檢視變更後合併。
          EOF
          )"
